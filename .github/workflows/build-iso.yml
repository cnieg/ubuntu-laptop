name: Build Ubuntu Custom ISO
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h max
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Free up disk space aggressively
      run: |
        echo "Espace initial:"
        df -h
        
        # Supprimer les gros packages inutiles
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        
        # Nettoyer apt
        sudo apt-get clean
        
        # Nettoyer Docker
        docker rmi $(docker image ls -aq) 2>/dev/null || true
        sudo rm -rf /var/lib/docker
        
        echo "Espace après nettoyage:"
        df -h
    
    - name: Check system resources
      run: |
        echo "=== CPU ==="
        nproc
        lscpu | grep "Model name"
        
        echo ""
        echo "=== Mémoire ==="
        free -h
        
        echo ""
        echo "=== Espace disque ==="
        df -h

    # Récupérer le SHA256 officiel de Canonical
    - name: Get official ISO SHA256
      id: get-sha
      run: |
        wget -q https://releases.ubuntu.com/25.10/SHA256SUMS -O /tmp/SHA256SUMS
        OFFICIAL_SHA=$(grep "ubuntu-25.10-live-server-amd64.iso" /tmp/SHA256SUMS | awk '{print $1}')
        echo "official_sha=$OFFICIAL_SHA" >> $GITHUB_OUTPUT
        echo "SHA256 officiel Canonical: $OFFICIAL_SHA"

    # Cache basé sur le SHA256 officiel (pas sur le script)
    - name: Cache Ubuntu base ISO
      id: cache-iso
      uses: actions/cache@v5
      with:
        path: ~/ubuntu-25.10-live-server-amd64.iso
        key: ubuntu-25.10-iso-${{ steps.get-sha.outputs.official_sha }}
        restore-keys: |
          ubuntu-25.10-iso-

    # Vérifier l'intégrité de l'ISO en cache (si elle existe)
    - name: Verify cached ISO integrity
      if: steps.cache-iso.outputs.cache-hit == 'true'
      run: |
        echo "ISO trouvée en cache, vérification de l'intégrité..."
        CACHED_SHA=$(sha256sum ~/ubuntu-25.10-live-server-amd64.iso | awk '{print $1}')
        OFFICIAL_SHA="${{ steps.get-sha.outputs.official_sha }}"
        
        if [ "$CACHED_SHA" = "$OFFICIAL_SHA" ]; then
          echo "✓ ISO en cache valide (SHA256: $CACHED_SHA)"
        else
          echo "✗ ISO en cache corrompue ou obsolète"
          echo "  Cached:   $CACHED_SHA"
          echo "  Official: $OFFICIAL_SHA"
          rm ~/ubuntu-25.10-live-server-amd64.iso
          exit 1
        fi

    # Télécharger uniquement si pas en cache OU si vérification a échoué
    - name: Download Ubuntu ISO (if not cached or corrupted)
      if: steps.cache-iso.outputs.cache-hit != 'true'
      run: |
        echo "ISO non trouvée en cache, téléchargement..."
        cd ~
        wget --progress=dot:giga -c https://releases.ubuntu.com/25.10/ubuntu-25.10-live-server-amd64.iso
        
        echo "Vérification du checksum..."
        DOWNLOADED_SHA=$(sha256sum ubuntu-25.10-live-server-amd64.iso | awk '{print $1}')
        OFFICIAL_SHA="${{ steps.get-sha.outputs.official_sha }}"
        
        if [ "$DOWNLOADED_SHA" = "$OFFICIAL_SHA" ]; then
          echo "✓ Checksum vérifié avec succès"
          echo "  SHA256: $DOWNLOADED_SHA"
        else
          echo "✗ Checksum invalide !"
          echo "  Downloaded: $DOWNLOADED_SHA"
          echo "  Official:   $OFFICIAL_SHA"
          exit 1
        fi

    - name: Verify ISO exists
      run: |
        if [ -f ~/ubuntu-25.10-live-server-amd64.iso ]; then
          echo "✓ ISO présente et vérifiée"
          ls -lh ~/ubuntu-25.10-live-server-amd64.iso
          sha256sum ~/ubuntu-25.10-live-server-amd64.iso
        else
          echo "✗ ISO manquante !"
          exit 1
        fi
    
    - name: Make build script executable
      run: chmod +x scripts/build-iso.sh
    
    - name: Build ISO with resource monitoring
      timeout-minutes: 300  # 5h pour le build
      run: |
        # Lancer un monitoring en arrière-plan
        (
          while true; do
            echo "=== [$(date +%H:%M:%S)] Ressources ==="
            free -h | grep Mem
            df -h /home | tail -1
            sleep 300  # Toutes les 5 minutes
          done
        ) &
        MONITOR_PID=$!
        
        # Lancer le build
        ./scripts/build-iso.sh
        BUILD_EXIT=$?
        
        # Arrêter le monitoring
        kill $MONITOR_PID 2>/dev/null || true
        
        exit $BUILD_EXIT
    
    - name: Verify ISO was created
      run: |
        if [ ! -f ~/iso-build/ubuntu-25.10-custom.iso ]; then
          echo "ERROR: ISO file not found!"
          echo "Contenu de ~/iso-build:"
          ls -la ~/iso-build/ || echo "Répertoire introuvable"
          exit 1
        fi
        
        echo "✓ ISO créée avec succès"
        ls -lh ~/iso-build/ubuntu-25.10-custom.iso
    
    - name: Generate checksum
      run: |
        cd ~/iso-build
        sha256sum ubuntu-25.10-custom.iso > ubuntu-25.10-custom.iso.sha256
        echo "Checksum:"
        cat ubuntu-25.10-custom.iso.sha256
    
    - name: Prepare Ventoy package
      run: |
        mkdir -p ventoy-package
        
        echo "Copie de l'ISO..."
        cp ~/iso-build/ubuntu-25.10-custom.iso ventoy-package/
        cp ~/iso-build/ubuntu-25.10-custom.iso.sha256 ventoy-package/
        
        echo "Création de la structure Ventoy..."
        mkdir -p ventoy-package/ventoy/ubuntu-autoinstall
        
        cp ventoy/ubuntu-autoinstall/user-data ventoy-package/ventoy/ubuntu-autoinstall/
        cp ventoy/ubuntu-autoinstall/meta-data ventoy-package/ventoy/ubuntu-autoinstall/
        cp ventoy/ventoy.json ventoy-package/ventoy/
                
        cat > ventoy-package/README-VENTOY.txt << 'VENTOYREADME'
        Ubuntu Laptop - Package Ventoy
        ===============================
        
        Ce package contient tout le nécessaire pour booter l'ISO sur Ventoy.
        
        Installation sur clé Ventoy:
        ----------------------------
        1. Montez votre clé Ventoy
        2. Copiez ubuntu-25.10-custom.iso à la racine de Ventoy
        3. Copiez le dossier "ventoy/" à la racine de Ventoy (fusionnez si existe déjà)
        
        Structure finale sur votre clé:
        /
        ├── ubuntu-25.10-custom.iso
        └── ventoy/
            ├── ventoy.json
            └── ubuntu-autoinstall/
                ├── user-data
                └── meta-data
        
        Configuration:
        --------------
        - Hostname: ubuntu-laptop
        - Username: ubuntu-admin
        - Clavier: FR
        - Locale: fr_FR.UTF-8
        - Stockage: LUKS + btrfs
        - Desktop: GNOME (Wayland)
        
        L'installation démarre automatiquement après 1 seconde.
        VENTOYREADME
        
        echo "Structure du package:"
        find ventoy-package -type f
    
    - name: Create Ventoy archive
      run: |
        tar czf ventoy-package.tar.gz ventoy-package/
        ls -lh ventoy-package.tar.gz
    
    - name: Final disk space check
      run: |
        echo "Espace disque final:"
        df -h
        echo ""
        echo "Taille du package Ventoy:"
        ls -lh ventoy-package.tar.gz
    
    - name: Upload Ventoy package (contient ISO + config)
      uses: actions/upload-artifact@v7
      with:
        name: ventoy-package-complete
        path: ventoy-package.tar.gz
        retention-days: 30
    
    - name: Create Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ventoy-package.tar.gz
        body: |
          ## Ubuntu 25.10 Custom ISO - Package Ventoy Complet
          
          Ce package contient :
          - L'ISO Ubuntu 25.10 personnalisée
          - Le checksum SHA256
          - Les fichiers de configuration Ventoy (user-data, meta-data, ventoy.json)
          - Le README d'installation
          
          ### Installation rapide
          1. Téléchargez `ventoy-package.tar.gz`
          2. Extrayez : `tar xzf ventoy-package.tar.gz`
          3. Suivez les instructions dans `ventoy-package/README-VENTOY.txt`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
