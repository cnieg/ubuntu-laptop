name: Build Ubuntu Custom ISO
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h max
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Free up disk space aggressively
      run: |
        echo "Espace initial:"
        df -h
        
        # Supprimer les gros packages inutiles
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        
        # Nettoyer apt
        sudo apt-get clean
        
        # Nettoyer Docker
        docker rmi $(docker image ls -aq) 2>/dev/null || true
        sudo rm -rf /var/lib/docker
        
        echo "Espace après nettoyage:"
        df -h
    
    - name: Check system resources
      run: |
        echo "=== CPU ==="
        nproc
        lscpu | grep "Model name"
        
        echo ""
        echo "=== Mémoire ==="
        free -h
        
        echo ""
        echo "=== Espace disque ==="
        df -h

    # Récupérer le SHA256 officiel de Canonical
    - name: Get official ISO SHA256
      id: get-sha
      run: |
        wget -q https://cdimage.ubuntu.com/ubuntu-server/daily-live/current/SHA256SUMS -O /tmp/SHA256SUMS
        OFFICIAL_SHA=$(grep "resolute-live-server-amd64.iso" /tmp/SHA256SUMS | awk '{print $1}')
        echo "official_sha=$OFFICIAL_SHA" >> $GITHUB_OUTPUT
        echo "SHA256 officiel Canonical: $OFFICIAL_SHA"

    # Cache basé sur le SHA256 officiel (pas sur le script)
    - name: Cache Ubuntu base ISO
      id: cache-iso
      uses: actions/cache@v3
      with:
        path: ~/resolute-live-server-amd64.iso
        key: ubuntu-26.04-iso-${{ steps.get-sha.outputs.official_sha }}
        restore-keys: |
          ubuntu-26.04-iso-

    # Vérifier l'intégrité de l'ISO en cache (si elle existe)
    - name: Verify cached ISO integrity
      if: steps.cache-iso.outputs.cache-hit == 'true'
      run: |
        echo "ISO trouvée en cache, vérification de l'intégrité..."
        CACHED_SHA=$(sha256sum ~/resolute-live-server-amd64.iso | awk '{print $1}')
        OFFICIAL_SHA="${{ steps.get-sha.outputs.official_sha }}"
        
        if [ "$CACHED_SHA" = "$OFFICIAL_SHA" ]; then
          echo "✓ ISO en cache valide (SHA256: $CACHED_SHA)"
        else
          echo "✗ ISO en cache corrompue ou obsolète"
          echo "  Cached:   $CACHED_SHA"
          echo "  Official: $OFFICIAL_SHA"
          rm ~/resolute-live-server-amd64.iso
          exit 1
        fi

    # Télécharger uniquement si pas en cache OU si vérification a échoué
    - name: Download Ubuntu ISO (if not cached or corrupted)
      if: steps.cache-iso.outputs.cache-hit != 'true'
      run: |
        echo "ISO non trouvée en cache, téléchargement..."
        cd ~
        wget --progress=dot:giga -c https://cdimage.ubuntu.com/ubuntu-server/daily-live/current/resolute-live-server-amd64.iso
        
        echo "Vérification du checksum..."
        DOWNLOADED_SHA=$(sha256sum resolute-live-server-amd64.iso | awk '{print $1}')
        OFFICIAL_SHA="${{ steps.get-sha.outputs.official_sha }}"
        
        if [ "$DOWNLOADED_SHA" = "$OFFICIAL_SHA" ]; then
          echo "✓ Checksum vérifié avec succès"
          echo "  SHA256: $DOWNLOADED_SHA"
        else
          echo "✗ Checksum invalide !"
          echo "  Downloaded: $DOWNLOADED_SHA"
          echo "  Official:   $OFFICIAL_SHA"
          exit 1
        fi

    - name: Verify ISO exists
      run: |
        if [ -f ~/resolute-live-server-amd64.iso ]; then
          echo "✓ ISO présente et vérifiée"
          ls -lh ~/resolute-live-server-amd64.iso
          sha256sum ~/resolute-live-server-amd64.iso
        else
          echo "✗ ISO manquante !"
          exit 1
        fi
    
    - name: Make build script executable
      run: chmod +x scripts/build-iso.sh
    
    - name: Build ISO with resource monitoring
      timeout-minutes: 300  # 5h pour le build
      run: |
        # Lancer un monitoring en arrière-plan
        (
          while true; do
            echo "=== [$(date +%H:%M:%S)] Ressources ==="
            free -h | grep Mem
            df -h /home | tail -1
            sleep 300  # Toutes les 5 minutes
          done
        ) &
        MONITOR_PID=$!
        
        # Lancer le build
        ./scripts/build-iso.sh ~/resolute-live-server-amd64.iso ~/iso-build/ubuntu-custom.iso
        BUILD_EXIT=$?
        
        # Arrêter le monitoring
        kill $MONITOR_PID 2>/dev/null || true
        
        exit $BUILD_EXIT
    
    - name: Verify ISO was created
      run: |
        if [ ! -f ~/iso-build/ubuntu-custom.iso ]; then
          echo "ERROR: ISO file not found!"
          echo "Contenu de ~/iso-build:"
          ls -la ~/iso-build/ || echo "Répertoire introuvable"
          exit 1
        fi
        
        echo "✓ ISO créée avec succès"
        ls -lh ~/iso-build/ubuntu-custom.iso
    
    - name: Generate checksum
      run: |
        cd ~/iso-build
        sha256sum ubuntu-custom.iso > ubuntu-custom.iso.sha256
        echo "Checksum:"
        cat ubuntu-custom.iso.sha256
      
    - name: Upload ISO 
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-custom ISO
        path: ~/iso-build/ubuntu-custom.iso
        retention-days: 30
    
    - name: Create Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ~/iso-build/ubuntu-custom.iso
        body: |
          ## Ubuntu Custom ISO 
          
          Ce package contient :
          - L'ISO Ubuntu personnalisée
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
